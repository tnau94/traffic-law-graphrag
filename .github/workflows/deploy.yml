name: CD
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # Cho phép kích hoạt thủ công từ giao diện GitHub Actions
jobs:
  build-and-push:
    name: Xây dựng và đẩy Image lên Docker Hub
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn mới nhất về
        uses: actions/checkout@v4

      - name: Thiết lập Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Đăng nhập vào Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push (Kèm Cache tăng tốc)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/traffic-law-api:latest
            ${{ secrets.DOCKER_USERNAME }}/traffic-law-api:${{ github.ref_name }}
        # Lưu cache trên GitHub Actions để các lần build sau nhanh hơn nhiều
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Cập nhật VPS (Deploy)
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Đăng nhập vào VPS, cập nhật và kiểm tra dịch vụ
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}         # Khuyên dùng SSH Key thay vì Password
          script: |
            set -e
            cd /opt/traffic-law-graphrag

            echo ">>> Kéo image mới nhất..."
            docker compose pull api

            echo ">>> Khởi động lại service api..."
            docker compose up -d api

            echo ">>> Dọn dẹp image cũ để giải phóng dung lượng đĩa..."
            docker image prune -f

            echo ">>> Đợi và kiểm tra trạng thái sức khỏe của API..."
            sleep 15
            docker compose ps
            curl -f http://localhost:8000/health || (echo "Healthcheck thất bại!" && exit 1)
            echo ">>> Deploy thành công!"