services:
  neo4j:
    image: neo4j:5.26-community
    container_name: traffic-law-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474" # Neo4j Browser HTTP
      - "7687:7687" # Bolt protocol
    environment:
      - NEO4J_AUTH=${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:-12345678}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=2G
      - NEO4J_server_memory_pagecache_size=1G
      - NEO4J_dbms_default__listen__address=0.0.0.0
    volumes:
      - ./.neo4j/data:/data
      - ./.neo4j/logs:/logs
      - ./.neo4j/import:/var/lib/neo4j/import
      - ./.neo4j/plugins:/plugins
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u ${NEO4J_USERNAME:-neo4j} -p ${NEO4J_PASSWORD:-12345678} 'RETURN 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  api:
    image: ${DOCKER_IMAGE:-tnaumib/traffic-law-api:latest} 
    build: .
    container_name: traffic-law-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Ghi đè URI kết nối để trỏ tới đúng container neo4j thay vì localhost
      - NEO4J_URI=bolt://neo4j:7687
    volumes:
      # Giữ lại cache mô hình BAAI/bge-m3 để không phải tải lại 2.2GB mỗi lần khởi động
      - hf_cache:/root/.cache/huggingface
      # (Tùy chọn) Mount thư mục data nếu muốn chạy tác vụ import/ingest trực tiếp từ container
      - ./data:/app/data
    depends_on:
      neo4j:
        condition: service_healthy

volumes:
  hf_cache: